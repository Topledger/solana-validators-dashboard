<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #9945FF;
      --sidebar-width: 280px;
    }
    .sidebar {
      background-color: #f8f9fa;
    }
    .markdown-section code {
      background-color: #f5f5f5;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.9em;
    }
    .markdown-section pre {
      background-color: #282c34;

      background-color: transparent;

    }

<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'Validator Dashboard',
      repo: 'topledger/solana-validators-dashboard',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search...',
        noData: 'No Results!',
        depth: 4
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>
  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
